name: Dex_Lips source-mouth and MP4 validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dex-lips-checks.yml'
      - 'app.py'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'requirements*.txt'
      - 'assets/references/**'
      - 'experiments/browser-wasm/fixtures/**'
      - 'experiments/browser-wasm/evidence/actual_rhubarb_mouthCues.json'
      - 'eval/**'
      - 'assets/mouth_sets/**'
      - 'site/assets/trace_core.js'
      - 'site-tests/trace_parity.cjs'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mp4-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and synthetic test voice tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak
      - name: Check system render prerequisites
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -encoders > "${RUNNER_TEMP}/ffmpeg_encoders.txt"
          grep 'libx264' "${RUNNER_TEMP}/ffmpeg_encoders.txt"
          grep 'aac' "${RUNNER_TEMP}/ffmpeg_encoders.txt"
      - name: Install real Rhubarb Lip Sync 1.14.0 (MIT) with pinned checksum
        env:
          RHUBARB_SHA256: a9a9074862cff47b2d59b8bf399a678a3b0b74f9452ad6ad94cb292913dd8667
        run: |
          cd "${RUNNER_TEMP}"
          curl -fsSL -o rhubarb.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip
          echo "${RHUBARB_SHA256}  rhubarb.zip" | sha256sum -c -
          unzip -q rhubarb.zip
          echo "${RUNNER_TEMP}/Rhubarb-Lip-Sync-1.14.0-Linux" >> "${GITHUB_PATH}"
      - name: Install limited runtime dependencies
        run: |
          python -m pip install -r requirements-ui.txt opencv-python-headless
          rhubarb --version
          node --version
      - name: Verify immutable bundled reference images
        run: |
          python scripts/verify_seed.py
      - name: Compile Python source
        run: |
          python -m compileall -q app.py src tests scripts
      - name: Run entire Python unit and media integration suite (real Rhubarb; wav2vec2 tests skip without the model)
        run: |
          python -m unittest discover -s tests -v
      - name: Accuracy harness runs real Rhubarb and reports wav2vec2 honestly as BLOCKED here
        run: |
          PYTHONPATH=src python -m dex_lips.eval --no-write | tee "${RUNNER_TEMP}/eval.txt"
          grep -q '^rhubarb-pocketsphinx: frame' "${RUNNER_TEMP}/eval.txt"
          grep -q '^wav2vec2-phoneme: BLOCKED' "${RUNNER_TEMP}/eval.txt"
      - name: Existing still and moving video compositor regression
        run: |
          PYTHONPATH=src python scripts/proof_smoke.py
      - name: Ensure Gradio studio constructs without relying on external hosting
        run: |
          python - <<'PY'
          import app
          studio = app.build()
          assert studio is not None
          print('Gradio Blocks constructed with source tracing and existing rendering')
          PY

  # Optional, manual: downloads torch CPU + the ~1.3 GB wav2vec2 model and
  # reproduces the full ACCURACY.md table. Not run on every push.
  engine-accuracy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System tools and real Rhubarb
        env:
          RHUBARB_SHA256: a9a9074862cff47b2d59b8bf399a678a3b0b74f9452ad6ad94cb292913dd8667
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          cd "${RUNNER_TEMP}"
          curl -fsSL -o rhubarb.zip https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip
          echo "${RHUBARB_SHA256}  rhubarb.zip" | sha256sum -c -
          unzip -q rhubarb.zip
          echo "${RUNNER_TEMP}/Rhubarb-Lip-Sync-1.14.0-Linux" >> "${GITHUB_PATH}"
      - name: Engine dependencies and explicit model download
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-engines.txt
          PYTHONPATH=src python -m dex_lips.engines --fetch-model
      - name: Reproduce ACCURACY.md and run engine tests
        run: |
          python -m unittest tests.test_engines_eval -v
          make accuracy
          git diff --stat -- ACCURACY.md eval/results
      - uses: actions/upload-artifact@v4
        with:
          name: accuracy
          path: |
            ACCURACY.md
            eval/results/
